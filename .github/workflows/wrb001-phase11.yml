name: WRB-001 Phase 11 Business Activation

on:
  push:
    branches: [main]
    paths:
      - 'adapters/**'
      - 'tests/phase11/**'
      - 'data/migrated/**'
      - '.github/workflows/wrb001-phase11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase11-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify business activation provider and port policy
        run: python -m unittest tests.phase11.test_business_activation -v

      - name: Upload exact Phase 11 source
        uses: actions/upload-artifact@v4
        with:
          name: wrb001-phase11-source
          path: |
            adapters/mia_execution_port.py
            adapters/mia_business_activation.py
            adapters/mia/registry/wrb001-phase11-runtime-registry.json
            tests/phase11/verify_activate_with_frozen_mia.py
            data/migrated/
          if-no-files-found: error
