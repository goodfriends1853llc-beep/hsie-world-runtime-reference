<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Release review · THE LIGHT I LEFT ON</title><link rel="stylesheet" href="style.css"><style>header{position:fixed;top:0;left:0;right:0;padding:20px;background:#08100ee8;z-index:2;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header p{font-size:14px;margin:0}header select{font:inherit;background:#18231c;color:#eee;padding:10px;border:1px solid #73856a}header a{color:#d5dfc7;font-size:14px}.review-note{color:#aab8a5}#fallback-note{position:fixed;bottom:24px;left:24px;background:#101714;padding:12px;max-width:80%;font-size:14px}</style></head><body><main><canvas id="panorama" tabindex="0" aria-label="Review panorama. Drag or use arrows; N faces north and D looks down."></canvas><img id="fallback" hidden alt="Panorama review"><p id="fallback-note" hidden>Interactive panorama unavailable on this device. Showing the complete source image.</p></main><header><p>WORKING BUILD · <span id="state-name">DEPARTURE</span></p><select id="select" aria-label="Review state"><option value="0">00 · Departure · Month 0</option><option value="1">01 · Trace · Month 2</option><option value="2">02 · Weathering · Month 4</option><option value="3">03 · Reclamation · Month 6</option><option value="4">04 · Foundation · Month 8</option><option value="5">05 · Reconstruction · Month 10</option><option value="6">06 · Dawn · Month 12</option></select><button id="motion" aria-pressed="false">Enable motion</button><button id="recenter" hidden>Center view</button><p id="motion-status" role="status" hidden></p><a href="index.html">Enter artifact</a><p class="review-note">All states are pre-authored. This review page is omitted from the sealed release.</p></header><script type="module">import {PhoneMotion} from './motion.js';import {Panorama} from './viewer.js';import {validateRelease} from './state.js';const config=validateRelease(await(await fetch('release.json')).json());let viewer;try{viewer=new Panorama(document.getElementById('panorama'));viewer.yaw=0;new PhoneMotion(viewer,document.getElementById('motion'),document.getElementById('motion-status'),document.getElementById('recenter'));}catch{document.getElementById('motion').hidden=true;document.getElementById('panorama').hidden=true;document.getElementById('fallback').hidden=false;document.getElementById('fallback-note').hidden=false;}const select=document.getElementById('select');async function show(){select.disabled=true;try{const s=config.states[Number(select.value)];if(viewer)await viewer.load(s.asset);else{document.getElementById('fallback').src=s.asset;}document.getElementById('state-name').textContent=s.name;}catch(e){document.getElementById('fallback-note').hidden=false;document.getElementById('fallback-note').textContent='This state could not load. '+e.message;}finally{select.disabled=false;}}select.addEventListener('change',show);await show();</script></body></html>
