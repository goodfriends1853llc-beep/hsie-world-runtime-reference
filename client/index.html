<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <title>WRB-001 — Brevard Reference Reconstruction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" aria-label="WRB-001 interactive 360 reference world">
    <div id="panorama" aria-label="Interactive 360 panorama"></div>

    <header class="hud" aria-live="polite">
      <div>
        <div class="eyebrow">WRB-001 / PHASE 4 RECONSTRUCTION</div>
        <div id="sceneLabel" class="scene-label">Loading governed reference data…</div>
      </div>
      <button id="motionToggle" class="hud-button" type="button" hidden>Motion</button>
    </header>

    <section id="entryOverlay" class="entry-overlay">
      <div class="entry-card">
        <div class="eyebrow">WORLD → PLACE → SPACE → TOPOLOGY → REPRESENTATION</div>
        <h1>EXPLORE BREVARD</h1>
        <p>The same three-scene POC is being reconstructed from separated World, Place, Business, Topology, and Representation records.</p>
        <button id="enableMotion" class="primary" type="button">ENABLE MOTION LOOK</button>
        <button id="useTouch" class="secondary" type="button">USE TOUCH INSTEAD</button>
        <p id="entryStatus" class="status" role="status"></p>
      </div>
    </section>

    <section id="modal" class="modal" hidden aria-modal="true" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-card">
        <button id="closeModal" class="close" type="button" aria-label="Close">×</button>
        <div id="modalType" class="eyebrow"></div>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
