<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Explore Brevard request received.">
  <title>Request Sent — Explore Brevard</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .thanks-shell{min-height:100svh;display:grid;place-items:center;padding:28px}
    .thanks-card{width:min(100%,720px);border:1px solid var(--line);background:var(--panel);padding:36px}
    .thanks-card h1{font-size:clamp(44px,8vw,82px);line-height:.92;letter-spacing:-.05em;margin:10px 0 20px}
    .thanks-card p{color:var(--muted);font-size:18px;max-width:640px}
    .thanks-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="thanks-shell">
    <section class="thanks-card">
      <p class="eyebrow">EXPLORE BREVARD</p>
      <h1>REQUEST SENT.</h1>
      <p>Your information has been submitted to Tommie. He will respond using the contact information you provided.</p>
      <p>If you requested an appointment, it is not confirmed until you receive a response.</p>
      <div class="thanks-actions">
        <a class="button button-primary" href="../">RETURN TO THE 360 WORLD</a>
        <a class="button button-ghost" href="./">TOMMIE'S PUBLIC HUB</a>
      </div>
    </section>
  </main>
</body>
</html>
