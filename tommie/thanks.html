<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Explore Brevard request received.">
  <title>Request Sent — Explore Brevard</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .thanks-shell{min-height:100svh;display:grid;place-items:center;padding:28px}
    .thanks-card{width:min(100%,700px);border:1px solid var(--line);background:var(--panel);padding:36px}
    .thanks-card h1{font-size:clamp(44px,8vw,78px);line-height:.92;letter-spacing:-.05em;margin:10px 0 18px}
    .thanks-card p{color:var(--muted);font-size:17px;line-height:1.55;max-width:620px}
    .thanks-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="thanks-shell">
    <section class="thanks-card">
      <p class="eyebrow">EXPLORE BREVARD · RECEIPT</p>
      <h1>MESSAGE RECEIVED.</h1>
      <p id="receiptCopy">Your request was sent to Tommie. You can keep exploring or head back to the public hub.</p>
      <div class="thanks-actions">
        <a class="button button-primary" href="../">KEEP EXPLORING</a>
        <a class="button button-ghost" href="./">TOMMIE'S PUBLIC HUB</a>
      </div>
    </section>
  </main>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    const copy = document.getElementById('receiptCopy');
    if (mode === 'book') {
      copy.textContent = 'Your booking request was sent to Tommie. A time is confirmed only after he responds.';
    } else if (mode === 'founding') {
      copy.textContent = 'Your founding-business request was sent to Tommie. He will review the details and respond with the next step.';
    }
  </script>
</body>
</html>
